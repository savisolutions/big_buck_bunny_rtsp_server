# Global settings.
logLevel: info
logDestinations: [stdout]

# Timeouts and queue (preserved from old config).
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

# RTSP server.
rtsp: yes
rtspTransports: [udp, tcp]
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

# Disable all other protocols to preserve the original behavior.
rtmp: no
hls: no
webrtc: no
srt: no

# Paths.
paths:
  big-buck-bunny:
    runOnInit: ffmpeg -re -stream_loop -1 -i BigBuckBunny.mov -c:v copy -c:a copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
